
<!DOCTYPE html>
<html>
<head>
    <title>Tech Club Registration Form</title>
</head>
<body>

    <h2>Tech Club Registration Form</h2>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="dob">
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <p>Choose Your Interests:</p>
        <input type="checkbox" id="coding" name="interest" value="Coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="robotics" name="interest" value="Robotics">
        <label for="robotics">Robotics</label>

        <input type="checkbox" id="web" name="interest" value="Web Development">
        <label for="web">Web Development</label>
        <br><br>

        <label for="course">Select Your Course:</label>
        <select id="course" name="course">
            <option value="">Choose a course</option>
            <option value="CSE">Computer Science</option>
            <option value="AI">Artificial Intelligence</option>
            <option value="ECE">Electronics</option>
        </select>
        <br><br>

        <label for="message">Why do you want to join?</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Submit Registration</button>
    </form>

</body>
</html>
