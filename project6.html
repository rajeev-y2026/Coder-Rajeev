<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Resume</title>
</head>
<body>

    <h1>My Resume</h1>

    <p>
        Hello! My name is Rajeev.
        <strong>I am a B.Tech student.</strong>
    </p>

    </div>

</body>
</html>
