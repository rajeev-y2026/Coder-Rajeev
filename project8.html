 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox


    </title>
<style>
   .container{
      background: blanchedalmond;
      display:flex
   }
   #box1{
      background: red;
   
      width: 40px;

   }
   #box2{
      background: yellow;
      border: 10px  ;
      width: 40px;
   }
   #box3{
      background: greenyellow;
      border: 10px  ;
      width: 40px;
   }
   #box4{
      background: blue;
      border: 10px ;
      width: 40px;
   }
</style>




 </head>
 
 <body>
   <div
      class="container">
      <div class="box" id="box1">box1</div>
      <div class="box" id="box2">box2</div>
      <div class="box" id="box3">box3</div>
      <div class="box" id="box4">box4</div>
   
   </div>
   
    
 </body>
 </html>
