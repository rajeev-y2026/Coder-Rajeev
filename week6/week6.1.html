
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        /* 6.1 Box Sizing */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .box {
            width: 300px;
            background-color: lightblue;

            padding: 30px;
            border: 5px solid blue;
            margin: 40px;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <h2>My Box</h2>
        <p>This is an example of CSS Box Model.</p>
    </div>

</body>
</html>
