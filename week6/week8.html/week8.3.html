
<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid 8.3</title>
    <style> 
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.dashboard {
    display: grid;

    grid-template-columns: 200px 1fr;
    grid-template-rows: 70px 1fr 60px;

    grid-template-areas:
        "head head"
        "side main"
        "foot foot";

    gap: 10px;
}

header {
    grid-area: head;
    background-color: lightblue;
    padding: 20px;
}

aside {
    grid-area: side;
    background-color: lightgreen;
    padding: 20px;
}

main {
    grid-area: main;
    background-color: lightyellow;
    padding: 20px;
}

footer {
    grid-area: foot;
    background-color: lightpink;
    padding: 20px;
}



    </style>
</head>
<body>

    <div class="dashboard">

        <header>Header</header>

        <aside>Sidebar</aside>

        <main>Main Content</main>

        <footer>Footer</footer>

    </div>

</body>
</html>
